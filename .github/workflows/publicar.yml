# Publica a demonstração no GitHub Pages a partir da branch principal.
#
# Antes do primeiro uso, ligue o Pages em:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# A publicação sai apenas da `main`, para que o endereço público reflita sempre
# o código integrado. Para publicar sob demanda (inclusive de outra branch),
# use "Run workflow" na aba Actions.

name: Publicar demonstração

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; publicações em fila são substituídas pela mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
